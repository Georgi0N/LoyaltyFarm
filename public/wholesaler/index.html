<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hasad — Wholesaler</title>
<link rel="icon" href="/assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  .w-wrap { max-width: 560px; margin: 0 auto; min-height: 100dvh; padding: 0 0 2rem; }
  .w-top { display:flex; align-items:center; gap:.7rem; padding: 1.1rem 1.25rem; background:#fff; border-bottom:1px solid var(--line-2); position:sticky; top:0; z-index:10; }
  .w-hero { background: linear-gradient(150deg,#0a5f34,#006f8a); color:#fff; padding: 1.5rem; margin: 1.15rem; border-radius: var(--r-xl); box-shadow: var(--shadow-lg); }
  .w-hero h2 { color:#fff; }
  .w-stats { display:flex; gap:1.5rem; margin-top:1rem; }
  .w-stats b { display:block; font-size:1.6rem; }
  .w-stats span { font-size:.82rem; color:rgba(255,255,255,.8); }
  .result-card { margin: 0 1.15rem; border-radius: var(--r-lg); overflow:hidden; box-shadow: var(--shadow); animation: pop .3s ease; }
  .result-banner { padding: 1.5rem; text-align:center; color:#fff; }
  .result-banner.valid { background: var(--grad); }
  .result-banner.invalid { background: linear-gradient(135deg,#e5484d,#b03236); }
  .result-banner .r-ico { width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;margin:0 auto .7rem; }
  .result-banner h2 { color:#fff; font-size:1.5rem; letter-spacing:.02em; }
  .result-body { background:#fff; padding: 1.3rem 1.4rem; }
  .r-field { display:flex; justify-content:space-between; padding:.75rem 0; border-bottom:1px solid var(--line-2); }
  .r-field:last-child { border-bottom:none; }
  .r-field span { color:var(--muted); font-size:.88rem; } .r-field b { font-size:1rem; text-align:end; }
  .login-wrap { max-width: 420px; margin: 0 auto; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; padding: 1.5rem; }
  .login-card { background:#fff; border-radius: var(--r-lg); padding: 2rem 1.6rem; box-shadow: var(--shadow-lg); }
  .login-logo { text-align:center; margin-bottom:1.5rem; } .login-logo img{height:46px;margin:0 auto .5rem;}
</style>
</head>
<body>
<div id="app"></div>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/wholesaler.js"></script>
</body>
</html>
